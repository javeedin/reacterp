<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C74634" />
    <meta name="description" content="ReactERP - Oracle Fusion Cloud ERP Integration Platform" />
    <link rel="manifest" href="./manifest.json" />
    <title>ReactERP v1.0</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA (only in production, not dev or Electron)
      if ('serviceWorker' in navigator && !window.electronAPI) {
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then((registration) => {
                console.log('SW registered:', registration.scope);
              })
              .catch((error) => {
                console.log('SW registration failed:', error);
              });
          });
        } else {
          // In dev mode, unregister any existing service worker to prevent stale cache
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => {
              registration.unregister();
              console.log('SW unregistered for dev mode');
            });
          });
        }
      }
    </script>
  </body>
</html>
