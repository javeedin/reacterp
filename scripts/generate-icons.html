<!DOCTYPE html>
<html>
<head>
  <title>ReactERP Icon Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #C74634; }
    .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
    .icon-item { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .icon-item canvas { display: block; margin: 0 auto 10px; }
    .icon-item a { display: inline-block; padding: 8px 16px; background: #C74634; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; }
    .icon-item a:hover { background: #A33B2C; }
    .instructions { background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ReactERP PWA Icon Generator</h1>

    <div class="instructions">
      <strong>Instructions:</strong>
      <ol>
        <li>Click "Download" on each icon size below</li>
        <li>Save them to <code>public/icons/</code> folder</li>
        <li>Name them exactly as shown (icon-72.png, icon-96.png, etc.)</li>
      </ol>
    </div>

    <div class="icon-grid" id="iconGrid"></div>
  </div>

  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    const grid = document.getElementById('iconGrid');

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#C74634');
      gradient.addColorStop(1, '#A33B2C');

      // Rounded rectangle
      const radius = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Letter R
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.55}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('R', size / 2, size / 2 + size * 0.05);
    }

    sizes.forEach(size => {
      const item = document.createElement('div');
      item.className = 'icon-item';

      const canvas = document.createElement('canvas');
      const displaySize = Math.min(size, 128);
      canvas.style.width = displaySize + 'px';
      canvas.style.height = displaySize + 'px';
      drawIcon(canvas, size);

      const label = document.createElement('div');
      label.innerHTML = `<strong>icon-${size}.png</strong><br>${size}x${size}`;
      label.style.marginBottom = '10px';

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `icon-${size}.png`;
      link.textContent = 'Download';

      item.appendChild(canvas);
      item.appendChild(label);
      item.appendChild(link);
      grid.appendChild(item);
    });
  </script>
</body>
</html>
