<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ReactERP Recorder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           font-size: 13px; background: #f7f7f7; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .header { background: #C74634; color: #fff; padding: 12px 14px;
              display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .badge { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 2px 8px; font-size: 11px; }

    /* ── Lock Screen ── */
    #lockScreen { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px; }
    #lockScreen h2 { margin: 0; font-size: 16px; }
    #lockScreen p  { margin: 0; color: #666; font-size: 12px; text-align: center; }
    .lock-icon { font-size: 40px; }

    /* ── Main UI ── */
    #mainScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Recording bar */
    .rec-bar { background: #fff; padding: 12px 14px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
    .rec-bar h2 { margin: 0 0 10px; font-size: 13px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.04em; }
    .rec-controls { display: flex; gap: 8px; align-items: center; }
    .timer { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; color: #1a1a1a; min-width: 56px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .dot.active { background: #e53935; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.3)} }

    /* Session info */
    .session-info { padding: 10px 14px; background: #fff8f6; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; display: none; }
    .session-info.visible { display: block; }
    .session-info input { width: 100%; padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 5px; font-size: 12px; margin-bottom: 6px; }
    .session-info select { width: 100%; padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 5px; font-size: 12px; background: #fff; }

    /* Steps list */
    .steps-header { padding: 10px 14px 6px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .steps-header span { font-weight: 600; }
    .steps-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
    .step-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 7px; margin-bottom: 7px;
                 overflow: hidden; transition: box-shadow 0.15s; }
    .step-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .step-body { padding: 8px 10px; }
    .step-num { display: inline-block; background: #C74634; color: #fff; border-radius: 50%;
                width: 18px; height: 18px; font-size: 10px; font-weight: 700;
                text-align: center; line-height: 18px; margin-right: 6px; flex-shrink: 0; }
    .step-desc { font-size: 12px; line-height: 1.4; }
    .step-url { font-size: 10px; color: #999; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step-shot { width: 100%; display: block; border-top: 1px solid #f0f0f0; max-height: 100px; object-fit: cover; }
    .step-actions { display: flex; gap: 6px; padding: 4px 8px; background: #fafafa; border-top: 1px solid #f0f0f0; }
    .step-actions button { background: none; border: none; font-size: 10px; color: #999; cursor: pointer; padding: 2px 4px; }
    .step-actions button:hover { color: #C74634; }

    /* Generate bar */
    .gen-bar { background: #fff; border-top: 1px solid #e5e5e5; padding: 10px 12px; flex-shrink: 0; }
    .gen-bar h3 { margin: 0 0 8px; font-size: 12px; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.04em; }
    .gen-btns { display: flex; gap: 6px; }

    /* Buttons */
    .btn { padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer;
           font-size: 12px; font-weight: 500; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-red    { background: #C74634; color: #fff; }
    .btn-dark   { background: #333; color: #fff; }
    .btn-green  { background: #1D7B4D; color: #fff; flex: 1; font-size: 11px; }
    .btn-blue   { background: #0572CE; color: #fff; flex: 1; font-size: 11px; }
    .btn-gray   { background: #e5e5e5; color: #333; }
    .btn-sm     { padding: 4px 10px; font-size: 11px; }

    /* Forms */
    .form-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .form-group label { font-size: 11px; color: #666; }
    .form-group input, .form-group select { padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 13px; width: 100%; }
    .form-group input:focus { outline: none; border-color: #C74634; }
    .err { color: #e53935; font-size: 11px; display: none; }

    .hidden { display: none !important; }
    .row { display: flex; gap: 8px; }
    .text-sm { font-size: 11px; color: #666; }
  </style>
</head>
<body>

<!-- LOCK SCREEN -->
<div class="header">
  <div class="header-left">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="white"/>
    </svg>
    <h1>ReactERP Recorder</h1>
  </div>
  <span class="badge" id="headerBadge"></span>
</div>

<div id="lockScreen">
  <div class="lock-icon">🔐</div>
  <h2 id="lockTitle">Welcome</h2>
  <p id="lockDesc">Set a password to protect your recordings</p>
  <div class="form-group" style="width:100%">
    <label id="pwLabel">Password</label>
    <input type="password" id="pwInput" placeholder="Enter password" />
  </div>
  <div class="form-group hidden" id="pwConfirmGroup" style="width:100%">
    <label>Confirm Password</label>
    <input type="password" id="pwConfirm" placeholder="Confirm password" />
  </div>
  <div class="err" id="pwErr">Incorrect password</div>
  <button class="btn btn-red" id="pwBtn" style="width:100%">Unlock</button>
  <p class="text-sm" id="forgotLink" style="cursor:pointer;text-decoration:underline;display:none">Forgot password? Reset all data</p>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen" class="hidden">

  <!-- Recording controls -->
  <div class="rec-bar">
    <h2>Recording</h2>
    <div class="rec-controls">
      <div class="dot" id="recDot"></div>
      <div class="timer" id="timer">00:00</div>
      <button class="btn btn-red" id="recBtn">⏺ Start</button>
      <button class="btn btn-gray btn-sm" id="addStepBtn" disabled>+ Step</button>
      <button class="btn btn-gray btn-sm" id="lockBtn">🔒</button>
    </div>
  </div>

  <!-- Session metadata (shown when recording) -->
  <div class="session-info" id="sessionInfo">
    <input type="text" id="sessionTitle" placeholder="Recording title (e.g. Create Invoice)" />
    <select id="sessionCat">
      <option value="General">General</option>
      <option value="AP - Payables">AP - Payables</option>
      <option value="GL - General Ledger">GL - General Ledger</option>
      <option value="Cash Management">Cash Management</option>
      <option value="Suppliers">Suppliers</option>
      <option value="Oracle Fusion">Oracle Fusion</option>
      <option value="System">System</option>
    </select>
  </div>

  <!-- Steps -->
  <div class="steps-header">
    <span>Steps <span id="stepCount">0</span></span>
    <button class="btn btn-gray btn-sm" id="clearBtn">Clear</button>
  </div>
  <div class="steps-list" id="stepsList">
    <p style="color:#999;font-size:12px;text-align:center;margin-top:24px">
      Start recording, then navigate your application.<br>Steps are captured automatically.
    </p>
  </div>

  <!-- Export buttons -->
  <div class="gen-bar">
    <h3>Generate Documents</h3>
    <div class="gen-btns">
      <button class="btn btn-green" id="genManualBtn" disabled>📄 User Manual</button>
      <button class="btn btn-blue" id="genUatBtn" disabled>🧪 UAT Script</button>
    </div>
  </div>

</div>

<script src="sidepanel.js"></script>
</body>
</html>
