<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 240px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #fff; }
    .header { background: #C74634; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .header svg { width: 20px; height: 20px; }
    .header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .body { padding: 16px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-primary { background: #C74634; color: #fff; }
    .btn-primary:hover { background: #a33827; }
    .desc { font-size: 12px; color: #666; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
    </svg>
    <h1>ReactERP Recorder</h1>
  </div>
  <div class="body">
    <button class="btn btn-primary" id="openPanel">Open Recorder Panel</button>
    <p class="desc">The recorder panel opens on the side so you can record while browsing Oracle Fusion or any web app.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
